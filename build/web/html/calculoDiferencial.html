<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cálculo Diferencial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/estilos_general.css">
<link rel="stylesheet" href="../css/semestres.css">
<link rel="stylesheet" href="../css/calculoDiferencial.css">

</head>
<body>

<div class="contenedor-semestres">

    <aside class="sidebar">
        <div class="semestre disabled"><h3>I Semestre</h3></div>
        <div class="sub-opciones disabled"></div>

        <div class="semestre disabled"><h3>II Semestre</h3></div>
        <div class="sub-opciones disabled"></div>

        <div class="semestre disabled"><h3>III Semestre</h3></div>
        <div class="sub-opciones disabled"></div>

        <div class="semestre" onclick="toggle(this,'s4')">
            <h3>IV Semestre</h3>
            <span class="flecha">▾</span>
        </div>
        <div class="sub-opciones" id="s4">
            <a href="calculoDiferencial.html">Calculo Diferencial</a>
            <a href="#">Fisica III</a>
            <a href="#">Quimica III</a>
            <a href="#">Dibujo Tecnico II</a>
            <a href="#">Ingles IV</a>
        </div>

        <div class="semestre" onclick="toggle(this,'s5')">
            <h3>V Semestre</h3>
            <span class="flecha">▾</span>
        </div>
        <div class="sub-opciones" id="s5">
            <a href="calculoIntegral.html">Calculo Integral</a>
            <a href="#">Fisica IV</a>
            <a href="#">Quimica IV</a>
            <a href="#">Orientacion III</a>
            <a href="#">Ingles V</a>
        </div>

        <div class="semestre disabled"><h3>VI Semestre</h3></div>
        <div class="sub-opciones disabled"></div>
    </aside>

    <main class="content-main">

        <div class="card">
            <h1>Cálculo Diferencial</h1>
            <h2>Selecciona tu cuestionario</h2>

            <div class="parciales">
                <button class="btn-parcial" onclick="seleccionarParcial(1)">Primer parcial</button>
                <button class="btn-parcial" onclick="seleccionarParcial(2)">Segundo parcial</button>
                <button class="btn-parcial" onclick="seleccionarParcial(3)">Tercer parcial</button>
            </div>

            <select id="tema" class="select-tema">
                <option>Selecciona un tema</option>
            </select>
            <h3>Elije tu modalidad</h3>
            <br>
            <div class="modos">
                <button class="modo">Retroalimentación</button>
                <button class="modo">Contra reloj</button>
                <button class="modo">Práctica</button>
            </div>

            <button class="iniciar">Iniciar</button>
        </div>

    </main>

</div>

<script>
function toggle(btn,id){
    let menu=document.getElementById(id);
    let flecha=btn.querySelector('.flecha');

    document.querySelectorAll('.sub-opciones').forEach(m=>{
        if(m.id!==id) m.style.maxHeight=null;
    });
    document.querySelectorAll('.semestre .flecha').forEach(f=>{
        if(f!==flecha) f.classList.remove('girar');
    });

    if(menu.style.maxHeight){
        menu.style.maxHeight=null;
        flecha.classList.remove('girar');
    } else {
        menu.style.maxHeight=menu.scrollHeight+'px';
        flecha.classList.add('girar');
    }
}

let parcialSeleccionado = null;
function seleccionarParcial(num){
    parcialSeleccionado = num;
    document.querySelectorAll('.btn-parcial').forEach(b=>b.classList.remove('activo'));
    document.querySelectorAll('.btn-parcial')[num-1].classList.add('activo');
}

function abrirMenu(id){
  let menu = document.getElementById(id);
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

const modos = document.querySelectorAll('.modo');

modos.forEach(m => {
    m.addEventListener('click', () => {
        modos.forEach(b => b.classList.remove('activo'));
        m.classList.add('activo');
    });
});

function seleccionarParcial(num){
    parcialSeleccionado = num;
    
 
    document.querySelectorAll('.btn-parcial').forEach(b=>b.classList.remove('activo'));
    document.querySelectorAll('.btn-parcial')[num-1].classList.add('activo');

    
    let select = document.getElementById('tema');
    select.innerHTML = ""; 

    let opciones = [];

    if(num === 1){
        opciones = [
            "Propiedades de los números reales",
            "Funciones",
            "Límites"
        ];
    }

    if(num === 2){
        opciones = [
            "La derivada y sus interpretaciones"
        ];
    }

    if(num === 3){
        opciones = [
            "Por el momento no hay disponibles"
        ];
    }

   
    opciones.forEach(op => {
        let option = document.createElement("option");
        option.textContent = op;
        option.value = op;
        select.appendChild(option);
    });
}

</script>

</body>
</html>
